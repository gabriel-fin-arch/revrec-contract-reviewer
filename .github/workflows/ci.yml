name: CI

on:
  push:
    branches: [main]
  pull_request:
  workflow_dispatch:

jobs:
  test:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      # The versions in uv.lock, exactly; --locked fails the job if the lock
      # no longer matches pyproject, rather than quietly resolving new ones.
      - name: Install dependencies
        run: uv sync --locked --extra dev

      # ruff and the rest of .pre-commit-config.yaml, on every file, so the
      # hooks a contributor runs and the checks CI runs are the same list.
      - name: Lint and pre-commit hooks
        run: uv run pre-commit run --all-files --show-diff-on-failure

      - name: Type check
        run: uv run mypy

      # Coverage goes to the job summary, where anyone looking at a run can see
      # it, with no third-party service.
      - name: Test, with coverage
        run: |
          uv run pytest -q --cov --cov-report=term
          uv run coverage report --format=markdown >> "$GITHUB_STEP_SUMMARY"

      # No API key in CI, so this is the offline path end to end. The eval
      # exits non-zero if any citation in any memo fails to resolve against
      # its source document, which is the one regression that would make the
      # whole thing untrustworthy without looking broken.
      - name: Review the corpus offline and check every citation resolves
        run: |
          uv run revrec generate-corpus
          uv run revrec review --extractor rules
          uv run revrec eval --extractor rules
          uv run revrec generate-corpus --set test
          uv run revrec eval --set test --extractor rules

  recalc:
    # recalc/rr_recalc.xlsx is the accountant's own reading of three contracts,
    # in Excel (#57). This reviews the same PDFs with the offline rules and
    # fails on any difference that isn't recorded, with its issue, in
    # evals/recalc_known_differences.toml, or on a recorded one that no longer
    # occurs; the job summary shows every row that differs.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install dependencies
        run: uv sync --locked --extra dev

      - name: Reconcile recalc/ against the tool
        # An explicit bash runs with -o pipefail, so a failing check isn't
        # hidden behind tee's exit status.
        shell: bash
        run: uv run python -m revrec_contract_reviewer.recalc_check | tee -a "$GITHUB_STEP_SUMMARY"

  provenance:
    # The published history against the real dates on record
    # (.github/provenance.toml). Fails on a rewrite of the history restored on
    # 15 October 2026, a second first commit, a commit dated before that
    # restoration or in the future, a published commit count the history no
    # longer shows, and, on a push, a previous tip the new history doesn't
    # contain. It only reads.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
        with:
          # The whole history, not just the last commit.
          fetch-depth: 0

      - name: Check the history against the dates on record
        # An explicit bash runs with -o pipefail, so a failing check isn't
        # hidden behind tee's exit status.
        shell: bash
        env:
          # The branch's tip before a push; empty on a pull request.
          PREVIOUS: ${{ github.event.before }}
        run: python3 src/revrec_contract_reviewer/provenance_check.py --previous "$PREVIOUS" | tee -a "$GITHUB_STEP_SUMMARY"

  container:
    # The image a reviewer can run without Python or uv: built from this
    # commit, the offline review run in it with a host folder for the memos,
    # and the memos checked on the host side.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Build the image
        run: docker build -t revrec-contract-reviewer .

      - name: Run the offline review in it
        run: |
          mkdir -p memos
          docker run --rm --user "$(id -u):$(id -g)" -v "$PWD/memos:/app/out" revrec-contract-reviewer | tee review.txt
          grep -q "contracts need a reviewer" review.txt
          test -f memos/index.html
          test "$(ls memos/*.html | wc -l)" -gt 10

  lowest-versions:
    # The floors in pyproject are a promise the job above never tests: it
    # resolves to the newest of everything. This one installs the oldest
    # versions the constraints allow, which is how several floors turned out
    # to be versions the code could not run on.
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5

      - name: Install uv
        uses: astral-sh/setup-uv@v7
        with:
          python-version: "3.11"

      - name: Install the lowest versions pyproject allows
        # Resolves afresh, ignoring uv.lock: the floors are a different set of
        # versions from the pinned one, and this job is the only one that tests them.
        run: uv sync --extra dev --resolution lowest-direct

      - name: Test
        run: uv run pytest -q
