[project]
name = "revrec-contract-reviewer"
version = "0.1.0"
description = "ASC 606 contract review for group-level revenue assurance, with every extracted fact cited back to the source PDF."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Gabriel S." }]
keywords = ["asc606", "revenue-recognition", "accounting", "document-extraction", "contract-review"]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Financial and Insurance Industry",
    "License :: OSI Approved :: MIT License",
    "Programming Language :: Python :: 3.11",
]
dependencies = [
    "pydantic>=2.6",
    "typer>=0.12",
    "pdfplumber>=0.11",
    "reportlab>=4.1",
    "jinja2>=3.1",
    "anthropic>=0.40",
    "python-dotenv>=1.0",
]

[project.optional-dependencies]
dev = ["pytest>=8.0", "pytest-cov>=5.0", "ruff>=0.6"]

[project.scripts]
revrec = "revrec_contract_reviewer.cli:app"

[build-system]
requires = ["hatchling"]
build-backend = "hatchling.build"

[tool.hatch.build.targets.wheel]
packages = ["src/revrec_contract_reviewer"]

[tool.pytest.ini_options]
pythonpath = ["src"]
testpaths = ["tests"]

[tool.ruff]
line-length = 120
target-version = "py311"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]

[tool.ruff.lint.per-file-ignores]
# typer builds its whole API out of Option()/Argument() calls in signature
# defaults, which is exactly what B008 exists to catch.
"src/revrec_contract_reviewer/cli.py" = ["B008"]
